# One flow, two backends (docs/ci.md): scripts/ci.sh is the whole CI. It runs here on GitHub's runners unless the
# repository variable CI_BACKEND is `cloudflare`, in which case Cloudflare Workers Builds runs the same script on every
# push (the Cloudflare GitHub App starts the build and posts the check run) and this job is skipped.
name: ci
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
jobs:
  ci:
    if: vars.CI_BACKEND != 'cloudflare'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.3.14" }
      - run: ./scripts/ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ci-status, path: ci/public, if-no-files-found: ignore }
