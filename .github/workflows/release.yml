# The release flow (docs/releasing.md) is scripts/release.sh. It runs here on GitHub's runners unless the repository
# variable CI_BACKEND is `cloudflare`; then Cloudflare Workers Builds runs it on every push to master and this job is
# skipped (without the attestation step below and without npm provenance: only GitHub Actions can mint the OIDC token).
#   push to master    -> release-please keeps the "chore(master): release X.Y.Z" PR up to date; once it is merged the
#                        same run tags, creates the release, publishes to npm and GitHub Packages, builds and attaches
#                        the executables and checksums, and puts the update hint in front of the notes
#   release published -> a release cut by hand (gh release create vX.Y.Z --notes ...) publishes the same way
#   workflow_dispatch -> a dry run: every step, nothing published, no release touched
name: release
on:
  push:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "run every step but publish nothing"
        type: boolean
        default: true
permissions:
  contents: write        # the release PR's commits, tags and release assets
  pull-requests: write   # the release PR
  packages: write        # GitHub Packages
  id-token: write        # npm provenance and the build attestations
  attestations: write    # provenance attestations for the release archives
jobs:
  release:
    if: vars.CI_BACKEND != 'cloudflare'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.3.14" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - id: release
        run: ./scripts/release.sh ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }} ${{ github.event_name == 'release' && format('--tag {0}', github.event.release.tag_name) || '' }}
        env:
          # a RELEASE_PLEASE_TOKEN (fine-grained PAT: contents + pull requests write) makes CI run on the release PR;
          # the workflow's own token cannot trigger other workflows
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest the archives
        if: steps.release.outputs.executables == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/release/*.zip
            dist/release/checksums.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: release-status, path: ci/public, if-no-files-found: ignore }
