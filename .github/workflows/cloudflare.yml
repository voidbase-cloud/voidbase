# GitHub only starts builds; Cloudflare Workers Builds runs them (docs/ci.md): scripts/ci.sh for every push to master
# and every pull request (the voidbase-ci project, whose deploy is the status page and, for a pull request, a preview
# URL). The release flow is the last step of that build: the commits decide whether the release PR is refreshed or a
# merged release PR is published (docs/releasing.md), and a release published by hand is picked up by the build of the
# tagged commit. The variables and the secret below are written by `bun scripts/cf-builds.ts setup --github`; until
# they exist the job is skipped.
name: cloudflare
on:
  push:
    branches: [master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
jobs:
  start:
    # no variables yet: nothing to start. Pull requests from forks: no secrets, and their commits are not in the connected repository.
    if: vars.CF_ACCOUNT_ID != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API: https://api.cloudflare.com/client/v4/accounts/${{ vars.CF_ACCOUNT_ID }}/builds
      TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_TOKEN }}
      COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      BRANCH: ${{ github.head_ref || (github.ref_type == 'branch' && github.ref_name) || '' }}
      # master and releases build on the master trigger, everything else on the branches trigger (a preview URL)
      TRIGGER: ${{ (github.event_name == 'pull_request' || (github.ref_type == 'branch' && github.ref_name != 'master')) && vars.CF_CI_TRIGGER_BRANCHES || vars.CF_CI_TRIGGER_MASTER }}
      WAIT: ${{ vars.CF_BUILDS_WAIT }}
    steps:
      - name: Start the build
        run: |
          [ -n "$TRIGGER" ] || { echo "no trigger uuid in the repository variables (bun scripts/cf-builds.ts setup --github)"; exit 1; }
          body=$(printf '{"commit_hash":"%s"%s}' "$COMMIT" "${BRANCH:+,\"branch\":\"$BRANCH\"}")
          res=$(curl -sS "$API/triggers/$TRIGGER/builds" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "$body")
          uuid=$(printf '%s' "$res" | jq -r '.result.build_uuid // empty')
          [ -n "$uuid" ] || { echo "no build started: $res"; exit 1; }
          echo "ci: build $uuid ($(printf '%s' "$res" | jq -r '.result.status // "queued"')) of $COMMIT${BRANCH:+ on $BRANCH}"
          echo "uuid=$uuid" >> "$GITHUB_ENV"
      - name: Wait for the build (repository variable CF_BUILDS_WAIT=1)
        if: env.WAIT == '1'
        run: |
          unknown=0
          while :; do
            # a finished build has status "stopped" and build_outcome "success" or "fail"
            status=$(curl -sS "$API/builds/$uuid" -H "Authorization: Bearer $TOKEN" | jq -r 'if .result.status == "stopped" then (.result.build_outcome // "fail") else (.result.status // empty) end')
            case "$status" in
              success) echo "ci: success"; exit 0 ;;
              fail|failure|failed|canceled|cancelled|timed_out|error) echo "ci: $status"; exit 1 ;;
              "") unknown=$((unknown + 1)); [ "$unknown" -lt 10 ] || { echo "cannot read the status of build $uuid; see the dashboard"; exit 1; } ;;
            esac
            sleep 30
          done
