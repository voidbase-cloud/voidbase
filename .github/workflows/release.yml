# Releases compiled from Conventional Commits (docs/releasing.md).
#   push to master   -> release-please keeps a "chore(master): release X.Y.Z" PR up to date (CHANGELOG.md, package.json);
#                       merging it tags vX.Y.Z, creates the GitHub release with the notes, and the publish job runs
#   release published -> a release cut by hand (gh release create vX.Y.Z --notes ...) publishes the same way
#   workflow_dispatch -> the publish job with `npm publish --dry-run`, nothing published, no release touched
name: release
on:
  push:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "run every publish step but publish nothing"
        type: boolean
        default: true
permissions:
  contents: write        # the release PR's commits, tags and release assets
  pull-requests: write   # the release PR
  packages: write        # GitHub Packages
  id-token: write        # npm provenance
jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # a RELEASE_PLEASE_TOKEN (fine-grained PAT: contents + pull requests write) makes CI run on the release PR;
          # the workflow's own token cannot trigger other workflows
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
  publish:
    needs: [release-please]
    if: always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'release' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
      TAG: ${{ needs.release-please.outputs.tag_name || github.event.release.tag_name || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.event.release.tag_name || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.3.14" }
      - uses: actions/setup-node@v4
        with: { node-version: "22", registry-url: "https://registry.npmjs.org", scope: "@voidbase-cloud" }
      - name: Install
        run: bun install --frozen-lockfile
      - name: Check and test
        run: |
          bun run check
          bun test
          bun test/cloud-rest.ts
      - name: Version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ -n "$TAG" ] && [ "$TAG" != "v$VERSION" ]; then echo "release tag $TAG does not match package.json version $VERSION"; exit 1; fi
          if npm view "@voidbase-cloud/voidbase@$VERSION" version >/dev/null 2>&1; then
            echo "@voidbase-cloud/voidbase@$VERSION is already on npm"; [ -n "$DRY_RUN" ] || exit 1; fi
      - name: Pack
        run: |
          npm pack
          ls -la voidbase-cloud-voidbase-*.tgz
      - name: Smoke-install the tarball
        run: |
          TARBALL="$PWD/$(ls voidbase-cloud-voidbase-*.tgz)"
          mkdir -p /tmp/smoke && cd /tmp/smoke
          bun init -y >/dev/null
          bun add "$TARBALL"
          bunx voidbase help | head -n 5
          node -e "const p=require('@voidbase-cloud/voidbase/package.json'); if (p.version !== '${{ steps.version.outputs.version }}') throw new Error('version mismatch')"
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PROVENANCE=""; [ "${{ github.event.repository.private }}" = "false" ] && PROVENANCE="--provenance"
          echo "provenance: ${PROVENANCE:-off (private repository)}  dry run: ${DRY_RUN:-no}"
          npm publish "$(ls voidbase-cloud-voidbase-*.tgz)" --access public $PROVENANCE $DRY_RUN
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "@voidbase-cloud:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=\${NODE_AUTH_TOKEN}" >> .npmrc
          npm publish "$(ls voidbase-cloud-voidbase-*.tgz)" --registry=https://npm.pkg.github.com $DRY_RUN
          rm -f .npmrc
      - name: Attach the tarball to the release
        if: ${{ env.DRY_RUN == '' && env.TAG != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" voidbase-cloud-voidbase-*.tgz --clobber
